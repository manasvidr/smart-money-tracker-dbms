<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Money Tracker — Peter Chen ER Diagram</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }
    .entity-rect {
      fill: #1e293b;
      stroke: #38bdf8;
      stroke-width: 2.5;
      rx: 4;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .weak-entity-outer {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2;
    }
    .rel-diamond {
      fill: #27272a;
      stroke: #f59e0b;
      stroke-width: 2.5;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .attr-oval {
      fill: #1e293b;
      stroke: #94a3b8;
      stroke-width: 1.5;
    }
    .attr-pk {
      fill: #1e293b;
      stroke: #f43f5e;
      stroke-width: 2;
    }
    .attr-derived {
      fill: #1e293b;
      stroke: #a855f7;
      stroke-width: 2;
      stroke-dasharray: 4, 3;
    }
    .conn-line {
      stroke: #64748b;
      stroke-width: 1.5;
    }
    .cardinality-text {
      fill: #38bdf8;
      font-size: 13px;
      font-weight: 700;
      font-family: monospace;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .label-text {
      font-size: 13px;
      fill: #f8fafc;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .attr-text {
      font-size: 11px;
      fill: #cbd5e1;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .pk-text {
      font-size: 11px;
      fill: #fda4af;
      font-weight: 600;
      text-decoration: underline;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .derived-text {
      font-size: 11px;
      fill: #d8b4fe;
      font-style: italic;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-900">

  <!-- Floating Controls -->
  <div class="fixed top-4 left-4 z-50 flex items-center gap-2 bg-slate-800/90 backdrop-blur border border-slate-700 p-2 rounded-xl shadow-xl">
    <div class="px-3 py-1 bg-sky-500/10 border border-sky-500/20 rounded-lg">
      <span class="text-xs font-semibold text-sky-400">PETER CHEN ER DIAGRAM</span>
    </div>
    <div class="h-4 w-px bg-slate-700"></div>
    <button id="zoomInBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 active:scale-95 text-xs font-medium rounded-lg transition">Zoom In (+)</button>
    <button id="zoomOutBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 active:scale-95 text-xs font-medium rounded-lg transition">Zoom Out (-)</button>
    <button id="resetBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 active:scale-95 text-xs font-medium rounded-lg transition">Reset View</button>
    <button id="exportSvgBtn" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 active:scale-95 text-xs font-medium text-white rounded-lg transition shadow-md">Export SVG</button>
  </div>

  <!-- Legend -->
  <div class="fixed bottom-4 left-4 z-50 bg-slate-800/90 backdrop-blur border border-slate-700 p-3 rounded-xl shadow-xl text-xs space-y-1.5 pointer-events-none">
    <div class="font-bold text-slate-300 mb-1 border-b border-slate-700 pb-1">CHEN NOTATION NOTATION SYMBOLS</div>
    <div class="flex items-center gap-2">
      <div class="w-5 h-3 border-2 border-sky-400 bg-slate-800 rounded-sm"></div>
      <span class="text-slate-300">Entity Set (Rectangle)</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 border-2 border-amber-500 bg-slate-800 rotate-45 transform origin-center"></div>
      <span class="text-slate-300 ml-1">Relationship Set (Diamond)</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-6 h-3 border border-slate-400 rounded-full"></div>
      <span class="text-slate-300">Attribute (Oval / Ellipse)</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-6 h-3 border-2 border-rose-500 rounded-full"></div>
      <span class="text-rose-300 underline font-semibold">Primary Key (Underlined in Oval)</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-6 h-3 border-2 border-purple-400 border-dashed rounded-full"></div>
      <span class="text-purple-300 italic">Derived Attribute (Dashed Oval: total_value)</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-sky-400 font-mono font-bold">1 : N / M : N</span>
      <span class="text-slate-400">Structural Cardinality Ratio</span>
    </div>
  </div>

  <!-- Instructions Help -->
  <div class="fixed bottom-4 right-4 z-50 bg-slate-800/80 backdrop-blur border border-slate-700 px-3 py-1.5 rounded-lg text-xs text-slate-400 pointer-events-none">
    <span>💡 Drag to pan | Mouse wheel to zoom</span>
  </div>

  <!-- Canvas SVG Viewport -->
  <svg id="viewport" width="100%" height="100%">
    <g id="canvasGroup"></g>
  </svg>

  <script>
    // Diagram Layout Coordinates and Definitions
    const diagramData = {
      // ENTITIES (Rectangles)
      entities: [
        { id: "USERS", name: "USERS", x: 250, y: 350, w: 140, h: 50 },
        { id: "ROLES", name: "ROLES", x: 250, y: 100, w: 140, h: 50 },
        { id: "AUDIT_LOGS", name: "AUDIT_LOGS", x: 250, y: 650, w: 150, h: 50 },
        { id: "COMPANIES", name: "COMPANIES", x: 800, y: 480, w: 150, h: 55 },
        { id: "DAILY_PRICES", name: "DAILY_PRICES", x: 1250, y: 320, w: 150, h: 50 },
        { id: "INSTITUTIONS", name: "INSTITUTIONS", x: 800, y: 150, w: 150, h: 50 },
        { id: "SEC_FILINGS", name: "SEC_FILINGS", x: 800, y: 800, w: 150, h: 50 },
        { id: "INSIDER_TRANSACTIONS", name: "INSIDER_TRANSACTIONS", x: 1300, y: 800, w: 190, h: 55 },
        { id: "INSIDERS", name: "INSIDERS", x: 450, y: 1050, w: 140, h: 50 },
        { id: "COMPANY_INSIDER_ROLES", name: "COMPANY_INSIDER_ROLES", x: 950, y: 1050, w: 210, h: 55 }
      ],

      // RELATIONSHIPS (Diamonds)
      relationships: [
        { id: "USER_ROLES", name: "USER_ROLES", x: 250, y: 220, e1: "USERS", card1: "N", e2: "ROLES", card2: "M" },
        { id: "USER_WATCHLIST", name: "USER_WATCHLIST", x: 550, y: 420, e1: "USERS", card1: "M", e2: "COMPANIES", card2: "N" },
        { id: "PERFORMS_AUDIT", name: "PERFORMS", x: 250, y: 500, e1: "USERS", card1: "1", e2: "AUDIT_LOGS", card2: "N" },
        { id: "HAS_PRICES", name: "HAS_PRICES", x: 1030, y: 390, e1: "COMPANIES", card1: "1", e2: "DAILY_PRICES", card2: "N" },
        { id: "INSTITUTIONAL_HOLDINGS", name: "INST_HOLDINGS", x: 800, y: 320, e1: "INSTITUTIONS", card1: "M", e2: "COMPANIES", card2: "N" },
        { id: "SUBMITS_FILING", name: "SUBMITS", x: 800, y: 650, e1: "COMPANIES", card1: "1", e2: "SEC_FILINGS", card2: "N" },
        { id: "CONTAINS_TX", name: "CONTAINS", x: 1070, y: 800, e1: "SEC_FILINGS", card1: "1", e2: "INSIDER_TRANSACTIONS", card2: "N" },
        { id: "TRANSACTION_COMPANIES", name: "ASSOCIATED_WITH", x: 1080, y: 620, e1: "COMPANIES", card1: "1", e2: "INSIDER_TRANSACTIONS", card2: "N" },
        { id: "HOLDS_ROLE", name: "HOLDS_ROLE", x: 680, y: 1050, e1: "INSIDERS", card1: "1", e2: "COMPANY_INSIDER_ROLES", card2: "N" },
        { id: "APPOINTS_ROLE", name: "APPOINTS", x: 890, y: 940, e1: "COMPANIES", card1: "1", e2: "COMPANY_INSIDER_ROLES", card2: "N" },
        { id: "TRANSACTION_OWNERS", name: "TX_OWNERS", x: 1180, y: 970, e1: "COMPANY_INSIDER_ROLES", card1: "1", e2: "INSIDER_TRANSACTIONS", card2: "N" }
      ],

      // ATTRIBUTES (Ovals)
      attributes: [
        // ROLES
        { entity: "ROLES", name: "role_id", isPK: true, dx: -100, dy: -60 },
        { entity: "ROLES", name: "role_name", isUQ: true, dx: 0, dy: -65 },
        { entity: "ROLES", name: "description", dx: 110, dy: -60 },

        // USER_ROLES (Relationship attributes)
        { rel: "USER_ROLES", name: "assigned_at", dx: -90, dy: 0 },

        // USERS
        { entity: "USERS", name: "user_id", isPK: true, dx: -130, dy: -40 },
        { entity: "USERS", name: "username", isUQ: true, dx: -135, dy: 20 },
        { entity: "USERS", name: "email", isUQ: true, dx: -120, dy: 70 },
        { entity: "USERS", name: "password_hash", dx: -70, dy: 110 },
        { entity: "USERS", name: "is_active", dx: 0, dy: 80 },
        { entity: "USERS", name: "created_at", dx: 80, dy: 80 },

        // USER_WATCHLIST (Relationship attributes)
        { rel: "USER_WATCHLIST", name: "added_at", dx: 0, dy: -60 },
        { rel: "USER_WATCHLIST", name: "notes", dx: 0, dy: 60 },

        // AUDIT_LOGS
        { entity: "AUDIT_LOGS", name: "log_id", isPK: true, dx: -120, dy: -50 },
        { entity: "AUDIT_LOGS", name: "table_name", dx: -130, dy: 0 },
        { entity: "AUDIT_LOGS", name: "action_type", dx: -120, dy: 50 },
        { entity: "AUDIT_LOGS", name: "record_id", dx: -60, dy: 90 },
        { entity: "AUDIT_LOGS", name: "action_timestamp", dx: 40, dy: 90 },
        { entity: "AUDIT_LOGS", name: "old_values", dx: 120, dy: 60 },
        { entity: "AUDIT_LOGS", name: "new_values", dx: 125, dy: 0 },

        // INSTITUTIONS
        { entity: "INSTITUTIONS", name: "institution_id", isPK: true, dx: -130, dy: -50 },
        { entity: "INSTITUTIONS", name: "cik", isUQ: true, dx: -30, dy: -70 },
        { entity: "INSTITUTIONS", name: "institution_name", dx: 70, dy: -70 },
        { entity: "INSTITUTIONS", name: "manager_name", dx: 130, dy: -40 },

        // INSTITUTIONAL_HOLDINGS (Relationship attributes)
        { rel: "INSTITUTIONAL_HOLDINGS", name: "report_date", isPK: true, dx: -110, dy: -25 },
        { rel: "INSTITUTIONAL_HOLDINGS", name: "shares_held", dx: -110, dy: 25 },
        { rel: "INSTITUTIONAL_HOLDINGS", name: "market_value", dx: 110, dy: -25 },
        { rel: "INSTITUTIONAL_HOLDINGS", name: "percentage_held", dx: 110, dy: 25 },

        // COMPANIES
        { entity: "COMPANIES", name: "company_id", isPK: true, dx: -130, dy: -45 },
        { entity: "COMPANIES", name: "cik", isUQ: true, dx: -70, dy: -70 },
        { entity: "COMPANIES", name: "ticker", isUQ: true, dx: 30, dy: -70 },
        { entity: "COMPANIES", name: "company_name", dx: 120, dy: -60 },
        { entity: "COMPANIES", name: "sector", dx: -130, dy: 45 },
        { entity: "COMPANIES", name: "industry", dx: -70, dy: 75 },

        // DAILY_PRICES
        { entity: "DAILY_PRICES", name: "price_date", isPK: true, dx: 10, dy: -65 },
        { entity: "DAILY_PRICES", name: "open_price", dx: 115, dy: -50 },
        { entity: "DAILY_PRICES", name: "high_price", dx: 140, dy: -10 },
        { entity: "DAILY_PRICES", name: "low_price", dx: 140, dy: 35 },
        { entity: "DAILY_PRICES", name: "close_price", dx: 115, dy: 75 },
        { entity: "DAILY_PRICES", name: "adj_close", dx: 50, dy: 85 },
        { entity: "DAILY_PRICES", name: "volume", dx: -30, dy: 80 },

        // SEC_FILINGS
        { entity: "SEC_FILINGS", name: "filing_id", isPK: true, dx: -120, dy: -45 },
        { entity: "SEC_FILINGS", name: "accession_number", isUQ: true, dx: -130, dy: 15 },
        { entity: "SEC_FILINGS", name: "filing_date", dx: -100, dy: 65 },
        { entity: "SEC_FILINGS", name: "report_period", dx: -30, dy: 85 },

        // INSIDER_TRANSACTIONS
        { entity: "INSIDER_TRANSACTIONS", name: "transaction_id", isPK: true, dx: 50, dy: -75 },
        { entity: "INSIDER_TRANSACTIONS", name: "transaction_date", dx: 135, dy: -55 },
        { entity: "INSIDER_TRANSACTIONS", name: "transaction_code", dx: 165, dy: -10 },
        { entity: "INSIDER_TRANSACTIONS", name: "shares_traded", dx: 165, dy: 35 },
        { entity: "INSIDER_TRANSACTIONS", name: "price_per_share", dx: 135, dy: 75 },
        { entity: "INSIDER_TRANSACTIONS", name: "total_value", isDerived: true, dx: 50, dy: 85 },
        { entity: "INSIDER_TRANSACTIONS", name: "created_at", dx: -30, dy: 85 },

        // INSIDERS
        { entity: "INSIDERS", name: "insider_id", isPK: true, dx: -110, dy: -50 },
        { entity: "INSIDERS", name: "full_name", dx: -110, dy: 40 },
        { entity: "INSIDERS", name: "sec_person_cik", isUQ: true, dx: 0, dy: 65 },

        // COMPANY_INSIDER_ROLES
        { entity: "COMPANY_INSIDER_ROLES", name: "role_assignment_id", isPK: true, dx: -70, dy: 75 },
        { entity: "COMPANY_INSIDER_ROLES", name: "title", dx: 25, dy: 80 },
        { entity: "COMPANY_INSIDER_ROLES", name: "is_officer", dx: 110, dy: 70 },
        { entity: "COMPANY_INSIDER_ROLES", name: "is_board_director", dx: 160, dy: 40 },
        { entity: "COMPANY_INSIDER_ROLES", name: "start_date", dx: 160, dy: -10 },
        { entity: "COMPANY_INSIDER_ROLES", name: "end_date", dx: 130, dy: -55 },

        // TRANSACTION_OWNERS (Relationship attributes)
        { rel: "TRANSACTION_OWNERS", name: "owner_role", dx: 0, dy: -55 },
        { rel: "TRANSACTION_OWNERS", name: "nature_of_ownership", dx: 95, dy: -45 },
        { rel: "TRANSACTION_OWNERS", name: "created_at", dx: 100, dy: 15 }
      ]
    };

    // Render SVG Elements
    const canvas = document.getElementById("canvasGroup");

    // 1. Draw Lines between Entities and Relationships
    diagramData.relationships.forEach(rel => {
      const e1 = diagramData.entities.find(e => e.id === rel.e1);
      const e2 = diagramData.entities.find(e => e.id === rel.e2);

      if (e1 && e2) {
        // Line e1 -> rel
        const line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line1.setAttribute("x1", e1.x);
        line1.setAttribute("y1", e1.y);
        line1.setAttribute("x2", rel.x);
        line1.setAttribute("y2", rel.y);
        line1.setAttribute("class", "conn-line");
        canvas.appendChild(line1);

        // Cardinality Text 1
        const mid1X = e1.x + (rel.x - e1.x) * 0.45;
        const mid1Y = e1.y + (rel.y - e1.y) * 0.45;
        const textCard1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textCard1.setAttribute("x", mid1X + 10);
        textCard1.setAttribute("y", mid1Y - 10);
        textCard1.setAttribute("class", "cardinality-text");
        textCard1.textContent = rel.card1;
        canvas.appendChild(textCard1);

        // Line rel -> e2
        const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line2.setAttribute("x1", rel.x);
        line2.setAttribute("y1", rel.y);
        line2.setAttribute("x2", e2.x);
        line2.setAttribute("y2", e2.y);
        line2.setAttribute("class", "conn-line");
        canvas.appendChild(line2);

        // Cardinality Text 2
        const mid2X = rel.x + (e2.x - rel.x) * 0.55;
        const mid2Y = rel.y + (e2.y - rel.y) * 0.55;
        const textCard2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textCard2.setAttribute("x", mid2X + 10);
        textCard2.setAttribute("y", mid2Y - 10);
        textCard2.setAttribute("class", "cardinality-text");
        textCard2.textContent = rel.card2;
        canvas.appendChild(textCard2);
      }
    });

    // 2. Draw Attribute Lines and Ovals
    diagramData.attributes.forEach(attr => {
      let originX = 0;
      let originY = 0;

      if (attr.entity) {
        const ent = diagramData.entities.find(e => e.id === attr.entity);
        if (ent) { originX = ent.x; originY = ent.y; }
      } else if (attr.rel) {
        const r = diagramData.relationships.find(rel => rel.id === attr.rel);
        if (r) { originX = r.x; originY = r.y; }
      }

      const attrX = originX + attr.dx;
      const attrY = originY + attr.dy;

      // Connecting line
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", originX);
      line.setAttribute("y1", originY);
      line.setAttribute("x2", attrX);
      line.setAttribute("y2", attrY);
      line.setAttribute("class", "conn-line");
      line.setAttribute("style", "stroke: #475569; stroke-width: 1.2;");
      canvas.appendChild(line);

      // Oval / Ellipse
      const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      ellipse.setAttribute("cx", attrX);
      ellipse.setAttribute("cy", attrY);
      
      const width = Math.max(50, attr.name.length * 4.4 + 14);
      ellipse.setAttribute("rx", width);
      ellipse.setAttribute("ry", 15);

      if (attr.isPK) {
        ellipse.setAttribute("class", "attr-pk");
      } else if (attr.isDerived) {
        ellipse.setAttribute("class", "attr-derived");
      } else {
        ellipse.setAttribute("class", "attr-oval");
      }
      canvas.appendChild(ellipse);

      // Text inside oval
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", attrX);
      text.setAttribute("y", attrY);

      if (attr.isPK) {
        text.setAttribute("class", "pk-text");
      } else if (attr.isDerived) {
        text.setAttribute("class", "derived-text");
      } else {
        text.setAttribute("class", "attr-text");
      }
      text.textContent = attr.name + (attr.isUQ ? " (UQ)" : "");
      canvas.appendChild(text);
    });

    // 3. Draw Relationships (Diamonds)
    diagramData.relationships.forEach(rel => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      
      const diamond = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      const dSizeW = Math.max(55, rel.name.length * 4.6 + 18);
      const dSizeH = 28;
      const pts = `${rel.x},${rel.y - dSizeH} ${rel.x + dSizeW},${rel.y} ${rel.x},${rel.y + dSizeH} ${rel.x - dSizeW},${rel.y}`;
      diamond.setAttribute("points", pts);
      diamond.setAttribute("class", "rel-diamond");
      g.appendChild(diamond);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", rel.x);
      text.setAttribute("y", rel.y);
      text.setAttribute("class", "label-text");
      text.setAttribute("style", "fill: #fef08a; font-size: 11px;");
      text.textContent = rel.name;
      g.appendChild(text);

      canvas.appendChild(g);
    });

    // 4. Draw Entities (Rectangles)
    diagramData.entities.forEach(ent => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", ent.x - ent.w / 2);
      rect.setAttribute("y", ent.y - ent.h / 2);
      rect.setAttribute("width", ent.w);
      rect.setAttribute("height", ent.h);
      rect.setAttribute("class", "entity-rect");
      g.appendChild(rect);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", ent.x);
      text.setAttribute("y", ent.y);
      text.setAttribute("class", "label-text");
      text.textContent = ent.name;
      g.appendChild(text);

      canvas.appendChild(g);
    });

    // Interactive Zoom and Pan
    let scale = 0.85;
    let translateX = 100;
    let translateY = 50;
    let isDragging = false;
    let startX, startY;

    const viewport = document.getElementById("viewport");
    const canvasGroup = document.getElementById("canvasGroup");

    function updateTransform() {
      canvasGroup.setAttribute("transform", `translate(${translateX}, ${translateY}) scale(${scale})`);
    }
    updateTransform();

    viewport.addEventListener("mousedown", (e) => {
      if (e.target.tagName !== "button") {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (isDragging) {
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener("mouseup", () => { isDragging = false; });

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.3, scale * zoomFactor), 2.5);
      updateTransform();
    }, { passive: false });

    document.getElementById("zoomInBtn").addEventListener("click", () => {
      scale = Math.min(2.5, scale * 1.2);
      updateTransform();
    });

    document.getElementById("zoomOutBtn").addEventListener("click", () => {
      scale = Math.max(0.3, scale * 0.8);
      updateTransform();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      scale = 0.85;
      translateX = 100;
      translateY = 50;
      updateTransform();
    });

    // Export SVG
    document.getElementById("exportSvgBtn").addEventListener("click", () => {
      const svgData = new XMLSerializer().serializeToString(viewport);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);
      const downloadLink = document.createElement("a");
      downloadLink.href = svgUrl;
      downloadLink.download = "Smart_Money_Tracker_Chen_ERD.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
  </script>
</body>
</html>
